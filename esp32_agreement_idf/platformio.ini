; E7 runtime comparison (Dr. Saha, 2026-11-05): the esp32_agreement protocol on the current
; Espressif TFLM port (espressif/esp-tflite-micro, ESP-IDF component manager) instead of the
; Arduino TensorFlowLite_ESP32 1.0.0 library. Same model files (bundle.txt), same host script.
; espressif32@6.12.0 = ESP-IDF 5.5 with idf-component-manager 2.x (6.5.0 / IDF 5.1.2 could not
; read the current esp-nn manifest and its builder needs pkg_resources).
;   py -m platformio run -d esp32_agreement_idf -e esp32dev -t upload --upload-port COM3
[env]
platform = espressif32@6.12.0
framework = espidf
monitor_speed = 921600
extra_scripts = pre:gen_model_data.py

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; Same runtime with esp-nn's optimized kernels switched off (CONFIG_NN_ANSI_C): isolates the
; kernel configuration from the TFLM version (Dr. Saha: "kernel configuration").
[env:esp32dev-ansi-c]
board = esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig_ansi_c.defaults"
