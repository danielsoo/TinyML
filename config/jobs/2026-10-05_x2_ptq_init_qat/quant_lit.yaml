# (B) QAT fine-tuning started from PTQ-calibrated ranges (Wu et al. 2020) vs tfmot's default +-6 start;
# base recipe (prune 50% -> FT 3 ep -> QAT 2 ep), same 5 client-0 fine-tuning draws as job m.
part: ptq_qat
calib_n: 2000
ft_samples: 10000
ft_draws: 5
qat_inits: [max, pct9999, mse, kl, clip5_max]
qat_fixed: [max, pct9999, mse, clip5_max]
models:
  - name: cic_near_iid
    model: data/processed/revision/2026-10-03_b_v3_float_cic/baseline/models/b_fl.h5
    config: data/processed/revision/2026-10-03_b_v3_float_cic/baseline/configs/b_fl.yaml
    ft_client: 0
  - name: ton_near_iid_v2
    model: data/processed/revision/2026-10-05_s_ton_sweep/ton_sweep/models/best_text_alpha05_test.h5
    config: data/processed/revision/2026-10-05_s_ton_sweep/ton_sweep/configs/best_text_alpha05_test.yaml
    ft_client: 0
