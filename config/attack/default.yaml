# Attack settings for scripts/run_robustness.py -> run_pgd.py.
# No `data:` block on purpose: run_pgd then uses the data block of the run's own config
# (same dataset, preprocessing and test split as training).
attack:
  epsilon_values: [0.01, 0.05, 0.1, 0.15, 0.2]
  epsilon_default: 0.1
  prediction_threshold: 0.3
  tune_target_success_rate: 0.5
eval:
  test_subset_size: 5000
  tune_subset_size: 5000
  adv_subset_size: 20000
  batch_size: 256
