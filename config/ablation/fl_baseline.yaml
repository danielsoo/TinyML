# (b) FL + cosine LR + focal loss, no QAT during training
# (self-contained; mirrors base.yaml)

data:
  name: cicids2017
  path: "data/raw/CIC-IDS2017"
  num_clients: 4
  max_samples: 2000000
  binary: true
  use_smote: true
  balance_ratio: 4.0
  partition_strategy: label_balanced

model:
  name: mlp

evaluation:
  prediction_threshold: 0.3

federated:
  num_rounds: 80
  local_epochs: 2
  batch_size: 128
  learning_rate: 0.0005
  use_class_weights: true
  use_focal_loss: true
  focal_loss_alpha: 0.7
  use_distillation: false
  server_momentum: 0.5
  server_learning_rate: 1.0
  lr_decay_type: cosine
  lr_min: 0.0001
  use_qat: false
  min_fit_clients: 4
  min_evaluate_clients: 4
  min_available_clients: 4

compression:
  always_build_traditional: false
