# v13 federated recipe, TON_IoT (network, text features). Same training recipe as config/paper_v12_toniot_v2/fl_baseline.yaml
# (60 rounds x 3 local epochs, FedAvgM 0.5 / 0.1, cosine 1e-3 -> 1e-4, focal loss, class weights),
# on the corrected pipeline (src/data/fed_pipeline.py, docs/AUDIT.md): dedup + conflicting labels dropped,
# fresh test split (seed 2027) drawn first, clients assigned before any fitted step, per-client real
# validation slice (10%), per-client undersampling 4:1, no SMOTE. federated.seed is set per run.
version: v13
data:
  name: ton_iot
  path: data/raw/TON_IoT
  num_clients: 4
  binary: true
  text_features: true
  balance_ratio: 4.0
  partition_strategy: label_balanced
  dirichlet_alpha: 0.3
  pipeline: v13
  split_mode: random
  test_size: 0.2
  split_seed: 2027
  partition_seed: 42
  val_frac: 0.1
  conflict_policy: drop
model:
  name: mlp
  hidden_units:
  - 512
  - 256
  - 128
evaluation:
  prediction_threshold: 0.3
federated:
  num_rounds: 60
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  local_epochs: 3
  batch_size: 128
  learning_rate: 0.001
  use_class_weights: true
  use_focal_loss: true
  focal_loss_alpha: 0.5
  use_distillation: false
  server_momentum: 0.5
  server_learning_rate: 0.1
  lr_decay_type: cosine
  lr_decay_rate: 0.97
  lr_drop_rate: 0.5
  lr_epochs_drop: 5
  lr_min: 0.0001
  use_qat: false
  min_fit_clients: 4
  min_evaluate_clients: 4
  min_available_clients: 4
  seed: 1
compression:
  always_build_traditional: false
  traditional_model_path: null
