  - {name: cic_P80, path: data/processed/revision/2026-10-29_z2b_compare_cic_fed/compare_arms/s1/P_80.tflite}
  - {name: cic_QC80, path: data/processed/revision/2026-10-29_z2e_compare_cic_qc/compare_arms/s1/QC_80.tflite}
  - {name: cic_PQ80_minmax, path: data/processed/revision/2026-10-29_z2f_range_cic2/range_mechanism/s1/PQ_80_A_random0.tflite}
  - {name: cic_PQ80_int16, path: data/processed/revision/2026-10-29_z2f_range_cic2/range_mechanism/s1/PQ_80_int16x8.tflite}
