; E7 device agreement: thousands of inputs streamed over serial, outputs compared bit-for-bit
; with the host TFLite interpreter (scripts/device_agreement.py). Models come from the bundle
; named in bundle.txt (built by the device_bundle step on the PC).
;   py -m platformio run -e esp32dev -t upload --upload-port COM3
;   py -m platformio run -e esp32-s3-native-usb -t upload --upload-port COM4
[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 921600
board_build.partitions = huge_app.csv
extra_scripts = pre:gen_model_data.py
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@1.0.0

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-s3-native-usb]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
