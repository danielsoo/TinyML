# Improved TON_IoT federated model (paper 5.14) re-run through Table 3/4: compression ablation.
# near-IID = the validation-selected model of job s (also the deployment model's source);
# centralized and Dirichlet = job u (same v2 config).
ft_samples: 10000
seed: 42
models:
  - name: ton2_near_iid
    model: data/processed/revision/2026-10-05_s_ton_sweep/ton_sweep/models/best_text_alpha05_test.h5
    config: data/processed/revision/2026-10-05_s_ton_sweep/ton_sweep/configs/best_text_alpha05_test.yaml
    ft_client: 0
  - name: ton2_centralized
    model: data/processed/revision/2026-10-05_u_toniot_v2/baseline/models/a_centralized.h5
    config: data/processed/revision/2026-10-05_u_toniot_v2/baseline/configs/a_centralized.yaml
    ft_client: 0
  - name: ton2_dirichlet_c2
    model: data/processed/revision/2026-10-05_u_toniot_v2/non_iid/models/fl_dirichlet_c4.h5
    config: data/processed/revision/2026-10-05_u_toniot_v2/non_iid/configs/fl_dirichlet_c4.yaml
    ft_client: 2
