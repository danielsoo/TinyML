; ESP32 IDS benchmark (paper Table 3 / Appendix B).
; Pick the env that matches your board:
;   pio run -e esp32dev -t upload          (classic ESP32 DevKit / WROOM / WROVER)
;   pio run -e esp32-s3-devkitc-1 -t upload
;   pio run -e esp32-c3-devkitm-1 -t upload
; Models in models/ are embedded automatically by gen_model_data.py.

[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
; FP32 baseline model (817 KB) does not fit the default 1.25 MB app partition
board_build.partitions = huge_app.csv
extra_scripts = pre:gen_model_data.py
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@1.0.0

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
